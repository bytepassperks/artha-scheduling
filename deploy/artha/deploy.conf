# Artha Scheduling (Cal.com) — gated auto-update config
MODULE_NAME="Artha Scheduling"
UPDATE_MODEL=source
UPSTREAM_BRANCH="main"
FORK_BRANCH="artha"
SCALINGO_APP="artha-scheduling"
SCALINGO_REGION="osc-fr1"
# Heaviest Next.js monorepo: gate-only (merge + verify + branding). The actual
# rebuild ships via the artha-cal-buildpack on Scalingo, triggered manually after
# a green gate — the free GitHub runner proves the merge is safe, never deploys.
DEPLOY_METHOD=none
LIVE_URL="https://artha-scheduling.osc-fr1.scalingo.io"
VERIFY_PATH="/auth/login"
EXPECTED_TOKEN="Artha Scheduling"
REBRAND_REQUIRE=(
  "packages/i18n/locales/en/common.json|Sign in to Artha Scheduling|login i18n brand string"
  "packages/i18n/locales/en/common.json|Create your Artha Scheduling account|signup i18n brand string"
)
REBRAND_FORBID=()
